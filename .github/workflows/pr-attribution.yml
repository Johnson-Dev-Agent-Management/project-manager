name: Pull request attribution

on:
  pull_request_target:
    types: [opened, edited, reopened]

# All other token permissions are disabled. Never check out or execute PR code here.
permissions:
  pull-requests: write

concurrency:
  group: pr-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Label explicitly AI-authored pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        # Use only runner-provided Python and its standard library; no checkout/actions.
        # PR text is read as data through the API, never interpolated into this script.
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              number = int(json.load(event_file)["number"])
          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]

          def request(method, path, data=None):
              payload = None if data is None else json.dumps(data).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repo}/{path}", data=payload, method=method,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          # Fetch current metadata so a queued edit does not use a stale event body.
          pr = request("GET", f"pulls/{number}")
          body = re.sub(r"<!--.*?(?:-->|$)", "", pr.get("body") or "", flags=re.S)
          types = []
          fence = None
          for line in body.splitlines():
              marker = re.match(r"^ {0,3}(`{3,}|~{3,})(.*)$", line)
              if marker:
                  delimiter, suffix = marker.groups()
                  if fence is None:
                      fence = delimiter
                  elif (delimiter[0] == fence[0] and len(delimiter) >= len(fence)
                        and not suffix.strip()):
                      fence = None
                  continue
              if fence is None and line.startswith("Implementation type:"):
                  types.append(line.strip())
          if types != ["Implementation type: AI"]:
              print("No single explicit AI attribution field; leaving labels unchanged.")
              raise SystemExit(0)

          label = "AI-authored"
          description = "Changes primarily implemented by an AI coding agent."
          try:
              existing = request("GET", f"labels/{label}")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              try:
                  existing = request("POST", "labels", {
                      "name": label, "color": "7057ff", "description": description,
                  })
              except urllib.error.HTTPError as create_error:
                  if create_error.code != 422:
                      raise
                  # Another PR may have created the shared label concurrently.
                  existing = request("GET", f"labels/{label}")
          if existing.get("description") != description or existing.get("name") != label:
              request("PATCH", f"labels/{label}", {
                  "new_name": label, "description": description,
              })
          request("POST", f"issues/{number}/labels", {"labels": [label]})
          print("Applied AI-authored to the explicitly attributed pull request.")
          PY
