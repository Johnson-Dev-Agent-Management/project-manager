name: Foundational CI
on:
  pull_request:
    branches: [main, codex/m0-phase-c-target]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Disable dependency download caches for bootstrap diagnosis
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: foundational-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
  npm_config_cache: ${{ github.workspace }}/.cache/npm
jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cold-cache != true }}
      - name: Frontend checks
        run: bash scripts/check.sh frontend 2>&1 | tee .artifacts/check.log
      - name: Package production frontend
        run: bash scripts/production-build.sh web
      - name: Upload production frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-production
          path: .artifacts/build/web
          if-no-files-found: error
          retention-days: 7
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cold-cache != true }}
      - name: Backend checks
        run: bash scripts/check.sh backend 2>&1 | tee .artifacts/check.log
      - name: Publish Release API
        run: bash scripts/production-build.sh api
      - name: Upload published API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-production
          path: .artifacts/build/api
          if-no-files-found: error
          retention-days: 7
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  windows-smoke:
    name: windows-smoke
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cold-cache != true }}
      - name: Rerun setup and build in Git Bash
        run: |
          bash scripts/setup.sh 2>&1 | tee .artifacts/setup-rerun.log
          bash scripts/build.sh 2>&1 | tee .artifacts/build.log
          echo 'Windows Git Bash: setup, repeated setup, and both builds Passed' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  e2e:
    name: e2e
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cold-cache != true }}
      - name: Install version-matched Chromium
        run: |
          npx --prefix src/web --no-install playwright install --with-deps chromium 2>&1 | tee .artifacts/browser-install.log
          npx --prefix src/web --no-install playwright --version
      - name: Download production frontend from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-production
          path: .artifacts/build/web
      - name: Download published API from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: api-production
          path: .artifacts/build/api
      - name: Ten consecutive browser persistence executions
        run: bash scripts/e2e-qualify.sh 2>&1 | tee .artifacts/e2e.log
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cold-cache != true }}
      - name: Standards, static analysis, and test integrity
        run: bash scripts/policy.sh 2>&1 | tee .artifacts/policy.log
      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: policy-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cold-cache != true }}
      - name: Secrets and current dependency advisories
        run: bash scripts/security.sh 2>&1 | tee .artifacts/security.log
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: supply-chain-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  quality-gate:
    name: quality-gate
    needs: [frontend, backend, windows-smoke, e2e, policy, supply-chain]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require explicit success from every job
        env:
          RESULTS: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'frontend', 'backend', 'windows-smoke', 'e2e', 'policy', 'supply-chain'}
          lines = [f"Head commit: {os.environ['HEAD_SHA']}",
                   f"Tested workflow commit: {os.environ['TESTED_SHA']}",
                   '', '| Job | Result |', '| --- | --- |']
          lines += [f"| {name} | {value['result']} |" for name, value in results.items()]
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary)
          if set(results) != expected or any(value['result'] != 'success' for value in results.values()):
              raise SystemExit('Failed: every required job must explicitly succeed')
          PY
